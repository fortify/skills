name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check-skill-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify skill versions bumped for changed skills
        run: |
          # Compare against the last release tag so that multiple commits within
          # a single release cycle only require one version bump.  New skills
          # (not present in the last release) must stay at 1.0.0 until first
          # release — intermediate version bumps for new skills are not allowed.
          latest_tag=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.' | head -1 || true)

          if [ -z "$latest_tag" ]; then
            echo "No release tags found — skipping version check"
            exit 0
          fi

          echo "Comparing skill versions against last release: $latest_tag"

          exit_code=0
          for skill_dir in skills/*/; do
            [ -d "$skill_dir" ] || continue
            skill_name=$(basename "$skill_dir")

            # New skills (not present in last release) must stay at 1.0.0.
            if ! git cat-file -e "${latest_tag}:${skill_dir}SKILL.md" 2>/dev/null; then
              version_current=$(grep -E '^\s+version:' "${skill_dir}SKILL.md" | head -1 \
                | sed 's/.*version: *//' | tr -d '"' | xargs)
              if [ "$version_current" != "1.0.0" ]; then
                echo "::error::Skill '$skill_name' is new (not in release '$latest_tag') but metadata.version is '$version_current' — must be '1.0.0' until first release"
                exit_code=1
              else
                echo "Skill '$skill_name' is new since '$latest_tag' — version is 1.0.0 as required"
              fi
              continue
            fi

            # Check if any non-SKILL.md files in this skill changed since last release.
            changed=$(git diff --name-only "${latest_tag}" HEAD -- "$skill_dir" \
              | grep -v 'SKILL.md$' || true)

            if [ -n "$changed" ]; then
              # Content changed — verify metadata.version was bumped since last release.
              version_at_tag=$(git show "${latest_tag}:${skill_dir}SKILL.md" \
                | grep -E '^\s+version:' | head -1 \
                | sed 's/.*version: *//' | tr -d '"' | xargs)
              version_current=$(grep -E '^\s+version:' "${skill_dir}SKILL.md" | head -1 \
                | sed 's/.*version: *//' | tr -d '"' | xargs)

              if [ "$version_at_tag" = "$version_current" ]; then
                echo "::error::Skill '$skill_name' has content changes since release '$latest_tag' but metadata.version in SKILL.md was not bumped (still $version_current)"
                exit_code=1
              fi
            fi
          done
          exit $exit_code

  release-please:
    needs: check-skill-versions
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        uses: fortify/3rdparty-actions/actions/googleapis/release-please-action/v5@main

  # Always build the release zip on every branch to validate the asset list.
  # Runs after release-please so the zip contains any version-bumped files.
  build-release-zip:
    needs: [check-skill-versions, release-please]
    # Also run if release-please was skipped (e.g. on non-main branch) to still validate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build release zip
        run: |
          paths=()
          while IFS= read -r entry || [ -n "$entry" ]; do
            entry="${entry%%#*}"
            entry="$(echo "$entry" | xargs)"
            [ -z "$entry" ] && continue
            [ -e "$entry" ] && paths+=("$entry")
          done < release-assets.txt
          zip -r ai-assistant-extensions.zip "${paths[@]}"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-assistant-extensions-zip
          path: ai-assistant-extensions.zip
          retention-days: 1

  upload-release-asset:
    needs: [release-please, build-release-zip]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download release zip
        uses: actions/download-artifact@v8
        with:
          name: ai-assistant-extensions-zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            ai-assistant-extensions.zip --clobber
